name: CI / Deploy

# Every push runs the fast test suite. A push to main that passes also
# deploys to the Heroku STAGING app (dannibar-compass-staging). Prod
# (dannibar-compass) is never auto-deployed — promote it deliberately
# (Heroku dashboard "Promote", or a manual `git push heroku-prod main`).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"   # matches runtime.txt
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run fast test suite
        run: pytest tests/ -q   # tests_browser/ (Playwright) is intentionally not gated

  deploy-staging:
    needs: test                                  # red tests block the deploy
    if: github.ref == 'refs/heads/main'          # only main, only after test passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Heroku wants full history
      - name: Push to Heroku staging
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/dannibar-compass-staging.git HEAD:refs/heads/main
          # Heroku then runs the build + the `release: python migrate.py`
          # phase automatically. A failed migration aborts the release.
