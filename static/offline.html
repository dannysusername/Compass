<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F1E8">
  <title>Offline — Compass</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4F1E8; color: #2B2B2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: bold;
      font-size: 28px; color: #1F3D7A; margin-bottom: 12px; }
    .logo span { color: #5b9d5b; font-style: normal; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #1F3D7A; }
    p { font-size: 15px; line-height: 1.5; color: #7A7468; max-width: 320px; margin: 0 0 20px; }
    button { background: #1F3D7A; color: #fff; border: 0; border-radius: 8px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Compass<span>.</span></div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Open it once while connected and it'll be here next time.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
