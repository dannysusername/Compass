<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F1E8">
    <title>{% block title %}Compass{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="stylesheet" href="{{ '/static/styles.css' | static_v }}">
    <!-- Offline write-queue (PWA). Deferred in <head> so it runs before the
         per-page todo.js, which calls into window.CompassSync. -->
    <script src="{{ '/static/sync.js' | static_v }}" defer></script>
    <script>
      // Apply saved theme before paint to avoid a flash of light mode.
      (function () {
        try {
          var t = localStorage.getItem("compass-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <header>
        <a href="/" class="logo"><em>Compass</em><span class="dot">.</span></a>
        {% if request.session.get("user_id") %}
        <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
        <label for="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
            <span class="nav-toggle-bars" aria-hidden="true"></span>
        </label>
        <nav class="top-nav" id="top-nav">
            <a href="/">Classes</a>
            <a href="/today">Today</a>
            <a href="/week">Week</a>
            <a href="/settings">Settings</a>
        </nav>
        {% endif %}
        <div class="header-actions">
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
            {% if request.session.get("user_id") %}
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="theme-toggle">Logout</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ '/static/upload.js' | static_v }}" defer></script>
    {% if COMPASS_ENV != 'test' %}
    <script>
      // Register the service worker → makes Compass installable and lets it
      // open + show your tasks offline. Skipped in the test env so a live SW
      // can't cache responses and flake the suite.
      //
      // Self-updating: check for a new worker on every load, and when one
      // takes control (after skipWaiting + clients.claim in sw.js) reload once
      // so the page runs the fresh JS/CSS instead of the old cached bundle.
      // Without this, an installed PWA stays pinned to stale code until the
      // user manually clears it — which is exactly the trap a deployed fix
      // would otherwise fall into.
      if ('serviceWorker' in navigator) {
        // Only auto-reload when an update REPLACES an existing controller — not
        // on the very first install (no controller yet → nothing stale to swap).
        if (navigator.serviceWorker.controller) {
          var _swRefreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (_swRefreshing) return;
            _swRefreshing = true;
            window.location.reload();
          });
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            if (reg && reg.update) reg.update();   // pull a newer sw.js if any
          }).catch(function () {});
        });
      }
    </script>
    {% endif %}
    {% if request.session.get("user_id") %}
    <script>
      // Detect the browser's IANA timezone and POST it so the server
      // can render today/overdue/week dates in the user's actual local
      // time instead of the hardcoded LOCAL_TZ default. Cheap fire-and-
      // forget on every page load — server short-circuits when the
      // value matches what's already stored.
      (function () {
        try {
          var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          if (!tz) return;
          var fd = new FormData();
          fd.append('tz', tz);
          fetch('/settings/timezone', {
            method: 'POST', body: fd, credentials: 'same-origin',
          }).catch(function () { /* network blip — try again next load */ });
        } catch (e) { /* old browser, no Intl */ }
      })();
    </script>
    {% endif %}
</body>
</html>
