<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F1E8">
    <title>{% block title %}Compass{% endblock %}</title>
    <link rel="stylesheet" href="{{ '/static/styles.css' | static_v }}">
    <script>
      // Apply saved theme before paint to avoid a flash of light mode.
      (function () {
        try {
          var t = localStorage.getItem("compass-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <header>
        <a href="/" class="logo"><em>Compass</em><span class="dot">.</span></a>
        {% if request.session.get("user_id") %}
        <input type="checkbox" id="nav-toggle" class="nav-toggle-cb">
        <label for="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
            <span class="nav-toggle-bars" aria-hidden="true"></span>
        </label>
        <nav class="top-nav" id="top-nav">
            <a href="/">Classes</a>
            <a href="/today">Today</a>
            <a href="/week">Week</a>
            <a href="/settings">Settings</a>
        </nav>
        {% endif %}
        <div class="header-actions">
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">Dark</button>
            {% if request.session.get("user_id") %}
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="theme-toggle">Logout</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ '/static/upload.js' | static_v }}" defer></script>
    {% if request.session.get("user_id") %}
    <script>
      // Detect the browser's IANA timezone and POST it so the server
      // can render today/overdue/week dates in the user's actual local
      // time instead of the hardcoded LOCAL_TZ default. Cheap fire-and-
      // forget on every page load — server short-circuits when the
      // value matches what's already stored.
      (function () {
        try {
          var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
          if (!tz) return;
          var fd = new FormData();
          fd.append('tz', tz);
          fetch('/settings/timezone', {
            method: 'POST', body: fd, credentials: 'same-origin',
          }).catch(function () { /* network blip — try again next load */ });
        } catch (e) { /* old browser, no Intl */ }
      })();
    </script>
    {% endif %}
</body>
</html>
