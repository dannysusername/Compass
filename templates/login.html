{% extends "base.html" %}
{% block title %}Log in — Compass{% endblock %}
{% block content %}

<div class="setup-card">
    <h1>Welcome back</h1>
    <p class="subtle">Log in to see your classes, tasks, and exam dates.</p>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
        <label>
            Email
            <input type="email" name="email" required autofocus value="{{ email or '' }}" autocomplete="email">
        </label>
        <label>
            Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit">Log in</button>
    </form>

    <p class="hint">No account yet? <a href="/signup">Sign up</a></p>
</div>

{% endblock %}
