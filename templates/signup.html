{% extends "base.html" %}
{% block title %}Sign up — Compass{% endblock %}
{% block content %}

<div class="setup-card">
    <h1>Create your account</h1>
    <p class="subtle">Compass keeps your syllabi, tasks, and exam dates in one place.</p>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" action="/signup">
        <label>
            Email
            <input type="email" name="email" required autofocus value="{{ email or '' }}" autocomplete="email">
        </label>
        <label>
            Password
            <input type="password" name="password" required autocomplete="new-password" minlength="8" maxlength="72">
        </label>
        <button type="submit">Sign up</button>
    </form>

    <p class="hint">Already have an account? <a href="/login">Log in</a></p>
</div>

{% endblock %}
